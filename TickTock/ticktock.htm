<!DOCTYPE html>
<html>

<head>
    <style>
        @keyframes tA {
            0% {
                transform: rotate(-20deg) translate(0px, 0px);
            }
            10% {
                transform: rotate(-20deg) translate(0px, 1px);
            }
            40% {
                transform: rotate(0deg) translate(0px, 1px);
            }
            50% {
                transform: rotate(0deg) translate(0px, 0px);
            }
            80% {
                transform: rotate(0deg) translate(0px, 0px);
            }
            100% {
                transform: rotate(-20deg) translate(0px, 0px);
            }
        }

        #t {
            animation: tA 1s ease-in-out infinite;
        }
        
        @keyframes ckA {
            0% {
                transform: rotate(-20deg) translate(0px, 0px);
            }
            10% {
                transform: rotate(-20deg) translate(0px, -1px);
            }
            40% {
                transform: rotate(0deg) translate(0px, -1px);
            }
            50% {
                transform: rotate(0deg) translate(0px, 0px);
            }
            80% {
                transform: rotate(0deg) translate(0px, 0px);
            }
            100% {
                transform: rotate(-20deg) translate(0px, 0px);
            }
        }
        
        #ck {
            animation: ckA 1s ease-in-out infinite;
        }
        
        @keyframes ioA {
            0% {
                transform: rotate(-20deg);
            }
            5% {
                transform: rotate(-20deg);
            }
            20% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(0deg);
            }
            55% {
                transform: rotate(0deg);
            }
            70% {
                transform: rotate(20deg);
            }
            100% {
                transform: rotate(20deg);
            }
        }
        
        #io {
            animation: ioA 2s ease-in-out infinite;
        }
    </style>
</head>

<body>
    <svg version="1.1" baseProfile="full" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:ev="http://www.w3.org/2001/xml-events"
        width="400px" height="400px" viewBox="-40 -40 80 80">
        <g id="t">
            <text text-anchor="middle" font-size="10" transform="rotate(0) translate(0 -30)">T</text>
        </g>
        
        <g id="ck">
            <text text-anchor="middle" font-size="10" transform="rotate(0) translate(0 -10)">C</text>
            <text text-anchor="middle" font-size="10" transform="rotate(0) translate(0 0)">K</text>
        </g>

        <g id="io">
            <text text-anchor="middle" font-size="10" transform="rotate(0) translate(0 -20)">I</text>        
            <text text-anchor="middle" font-size="10" transform="rotate(20) translate(0 -20)">O</text>
            <text text-anchor="middle" font-size="10" transform="rotate(40) translate(0 -20)">I</text>
            <text text-anchor="middle" font-size="10" transform="rotate(60) translate(0 -20)">O</text>
            <text text-anchor="middle" font-size="10" transform="rotate(80) translate(0 -20)">I</text>        
            <text text-anchor="middle" font-size="10" transform="rotate(100) translate(0 -20)">O</text>
            <text text-anchor="middle" font-size="10" transform="rotate(120) translate(0 -20)">I</text>
            <text text-anchor="middle" font-size="10" transform="rotate(140) translate(0 -20)">O</text>
            <text text-anchor="middle" font-size="10" transform="rotate(160) translate(0 -20)">I</text>        
            <text text-anchor="middle" font-size="10" transform="rotate(180) translate(0 -20)">O</text>
            <text text-anchor="middle" font-size="10" transform="rotate(200) translate(0 -20)">I</text>
            <text text-anchor="middle" font-size="10" transform="rotate(220) translate(0 -20)">O</text>
            <text text-anchor="middle" font-size="10" transform="rotate(240) translate(0 -20)">I</text>        
            <text text-anchor="middle" font-size="10" transform="rotate(260) translate(0 -20)">O</text>
            <text text-anchor="middle" font-size="10" transform="rotate(280) translate(0 -20)">I</text>
            <text text-anchor="middle" font-size="10" transform="rotate(300) translate(0 -20)">O</text>
            <text text-anchor="middle" font-size="10" transform="rotate(320) translate(0 -20)">I</text>        
            <text text-anchor="middle" font-size="10" transform="rotate(340) translate(0 -20)">O</text>
        </g>
        
        <circle cx="0" cy="0" r="0.5" stroke="none" fill="black"
    </svg>
</body>

</html>
