<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<link rel="index" href="index.html" />
	<title>Title</title>
	<!--[if IE]>
			<script src="excanvas.js"></script>
		<![endif]-->
	<!--[if lt IE 9]>
			<script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
		<![endif]-->

	<script>
		var canvas;
		var context;

		var points;
		var lines;
		var triangles;
		
		const pointSize = 10;
		const pointSize2 = pointSize*pointSize;
		
		var selectedPointIndex;
		var hoveredPointIndex;
		var mousePoint;
		
		var blockingLineIndex;
		var blockingPointIndex;
		
		var playerIndex;
		var playerScores;
		
		function Point(x, y) {
			this.x = x;
			this.y = y;

			this.Draw = function(i) {
				context.strokeStyle = "#000000";
				context.lineWidth = 1;
				if( blockingPointIndex == i )
				{
					context.fillStyle = "#ff0000";
				}
				else
				{
					context.fillStyle = "#000000";
				}
			
				if( selectedPointIndex == i )
				{
					context.fillRect(this.x - pointSize, this.y - pointSize, 2*pointSize, 2*pointSize);
				}
				else
				{
					context.fillRect(this.x - pointSize / 2, this.y - pointSize / 2, pointSize, pointSize);
				}
				
				if( hoveredPointIndex == i )
				{
					context.strokeRect(this.x - 2*pointSize, this.y - 2*pointSize, 4*pointSize, 4*pointSize);
				}
				
				//context.fillText( i + " (" + this.x + ", " + this.y + ")", this.x+pointSize, this.y+pointSize );
				//context.fillText( i, this.x+pointSize, this.y+pointSize );
			}
		}

		function Line(pi1, pi2) {
			this.pi1 = pi1;
			this.pi2 = pi2;
			this.owner = playerIndex;

			this.Draw = function(i) {
				context.lineWidth = pointSize / 2;
				if( blockingLineIndex == i )
				{
					context.strokeStyle = "#ff0000";
				}
				else
				{
					if( this.owner == 0 )
					{
						context.strokeStyle = "#00ff00";
					}
					else
					{
						context.strokeStyle = "#0000ff";
					}
				}
			
				context.beginPath();
				context.moveTo( points[this.pi1].x, points[this.pi1].y);
				context.lineTo( points[this.pi2].x, points[this.pi2].y);
				context.stroke();
			}
		}

		function Triangle(pi1, pi2, pi3) {
			this.pi1 = pi1;
			this.pi2 = pi2;
			this.pi3 = pi3;
			this.owner = playerIndex;

			this.Draw = function() {
				if( this.owner == 0 )
				{
					context.fillStyle = "rgba( 0, 255, 0, 0.5 )";
				}
				else
				{
					context.fillStyle = "rgba( 0, 0, 255, 0.5 )";
				}
				context.beginPath();
				context.moveTo(points[this.pi1].x, points[this.pi1].y);
				context.lineTo(points[this.pi2].x, points[this.pi2].y);
				context.lineTo(points[this.pi3].x, points[this.pi3].y);
				context.fill();
			}
		}

		function Init() {
			canvas = document.getElementById("testCanvas");
			context = canvas.getContext("2d");
			
			player1score = document.getElementById("player1score");
			player2score = document.getElementById("player2score");

			points = new Array();
			lines = new Array();
			triangles = new Array();
			
			for (var i = 0; i < 20; i++)
			{
				points[i] = new Point(
					(Math.random() * (canvas.width - (4*pointSize))) + 2*pointSize,
					(Math.random() * (canvas.height - (4*pointSize))) + 2*pointSize);
			}
			for( var k = 0; k < 10; k ++ )
			{
				for( var i in points )
				{
					var p1 = points[i];
					var p1x = p1.x;
					var p1y = p1.y;

					for( var j in points )
					{
						if( j != i )
						{
							var p2 = points[j];
							var p2x = p2.x;
							var p2y = p2.y;
							var dx = p1x - p2x;
							var dy = p1y - p2y;
							var d2 = (dx*dx + dy*dy);
							if( d2 > 0 && d2 < 0.0001 )
							{
								d2 = 0.0001;
							}
							else if( d2 < 0 && d2 > -0.0001 )
							{
								d2 = -0.0001;
							}
							var d = Math.sqrt( d2 );
							dx = dx / d;
							dy = dy / d;
							var id2 = 1/d2;

							p1x = p1x + 100*dx*id2;
							p1y = p1y + 100*dy*id2;
							
							points[j].x = p2x - 100*dx*id2;
							points[j].y = p2y - 100*dy*id2;
						}
					}
					points[i].x = p1x;
					points[i].y = p1y;
				}
			}
			
			for( var i in points )
			{
				if( points[i].x < 0 )
				{
					points[i].x = 2*pointSize;
				}
				else if( points[i].x >= canvas.width )
				{
					points[i].x = canvas.width-2*pointSize;
				}
				if( points[i].y < 0 )
				{
					points[i].y = 2*pointSize;
				}
				else if( points[i].y >= canvas.height )
				{
					points[i].y = canvas.height-2*pointSize;
				}
			}

			selectedPointIndex = null;
			hoveredPointIndex = null;
			mousePoint = new Point(0, 0);
			
			blockingLineIndex = null;
			blockingPointIndex = null;
			
			playerIndex = 0;
			playerScores = new Array();
			playerScores[0] = 0;
			playerScores[1] = 0;
			
			canvas.addEventListener("click", OnClickHandler, false);
			canvas.addEventListener("mousemove", OnMouseMoveHandler, false);

			return setInterval(Draw, 25);
		}
		
		function OnMouseMoveHandler(e) {
			if (e.pageX || e.pageY) {
				mouseX = e.pageX;
				mouseY = e.pageY;
			}
			else {
				mouseX = e.clientX +
						document.body.scrollLeft +
						document.documentElement.scrollLeft;
				mouseY = e.clientY +
						document.body.scrollTop +
						document.documentElement.scrollTop;
			}

			mouseX -= canvas.offsetLeft;
			mouseY -= canvas.offsetTop;

			hoveredPointIndex = null;
			for( var i in points )
			{
				var p = points[i];
				var dx = p.x - mouseX;
				var dy = p.y - mouseY;

				var d2 = dx * dx + dy * dy;
				if (d2 < pointSize2)
				{
					hoveredPointIndex = i;
					break;
				}
			}
			
			mousePoint.x = mouseX;
			mousePoint.y = mouseY;
		}
		
		function OnClickHandler(e) {
			if (e.pageX || e.pageY) {
				mouseX = e.pageX;
				mouseY = e.pageY;
			}
			else {
				mouseX = e.clientX +
						document.body.scrollLeft +
						document.documentElement.scrollLeft;
				mouseY = e.clientY +
						document.body.scrollTop +
						document.documentElement.scrollTop;
			}

			mouseX -= canvas.offsetLeft;
			mouseY -= canvas.offsetTop;

			var foundPoint = false;
			for( var i in points )
			{
				var p = points[i];
				var dx = p.x - mouseX;
				var dy = p.y - mouseY;

				var d2 = dx * dx + dy * dy;
				if (d2 < pointSize2) {
					if( selectedPointIndex == null )
					{
						selectedPointIndex = i;
					}
					else
					{
						if( i < selectedPointIndex )
						{
							AddLine( i, selectedPointIndex );
						}
						else
						{
							AddLine( selectedPointIndex, i );
						}
					}
					foundPoint = true;
					break;
				}
			}
			
			if( !foundPoint )
			{
				selectedPointIndex = null;
				blockingLineIndex = null;
				blockingPointIndex = null;
			}
		}

		function Draw() {
			if( playerIndex == 0 )
			{
				player1score.innerHTML = "*Player 1: " + playerScores[0];
				player2score.innerHTML = " Player 2: " + playerScores[1];
			}
			else
			{
				player1score.innerHTML = " Player 1: " + playerScores[0];
				player2score.innerHTML = "*Player 2: " + playerScores[1];
			}
			
			context.clearRect(0, 0, canvas.width, canvas.height);
			
			for (var i = 0; i < triangles.length; i++) {
				triangles[i].Draw();
			}

			for (var i = 0; i < lines.length; i++) {
				lines[i].Draw(i);
			}

			for (var i = 0; i < points.length; i++) {
				points[i].Draw(i);
			}
			
			if( selectedPointIndex != null )
			{
				context.strokeStyle = "#000000";
				context.lineWidth = 1;
				context.beginPath();
				context.moveTo( points[selectedPointIndex].x, points[selectedPointIndex].y );
				context.lineTo( mousePoint.x, mousePoint.y );
				context.stroke();
			}
		}
		
		function AddLine( pi1, pi2 ) {
			blockingLineIndex = null;
			blockingPointIndex = null;
		
			if( pi1 >= pi2 ) {
				return false;
			}
		
			var p1 = points[pi1];
			var p1x = p1.x;
			var p1y = p1.y;
			var p2 = points[pi2];
			var p2x = p2.x;
			var p2y = p2.y;
			
			var dx = p1x - p2x;
			var dy = p1y - p2y;
			var d2 = dx*dx + dy*dy;
			var d = Math.sqrt( d2 );
			
			var min1x = Math.min( p1x, p2x );
			var min1y = Math.min( p1y, p2y );
			var max1x = Math.max( p1x, p2x );
			var max1y = Math.max( p1y, p2y );
			
			for( var i in lines )
			{
				var line = lines[i];
				if( line.pi1 == pi1 && line.pi2 == pi2 )
				{
					return false;
				}
				else
				{
					var p3 = points[line.pi1];
					var p3x = p3.x;
					var p3y = p3.y;
					var p4 = points[line.pi2];
					var p4x = p4.x;
					var p4y = p4.y;
					
					var min2x = Math.min( p3x, p4x );
					var min2y = Math.min( p3y, p4y );
					var max2x = Math.max( p3x, p4x );
					var max2y = Math.max( p3y, p4y );
					
					if(	(min1x < max2x) && (max1x > min2x) &&
						(min1y < max2y) && (max1y > min2y) )
					{
						var v1x = p3x - p4x;
						var v1y = p3y - p4y;
						var v2x = p1x - p4x;
						var v2y = p1y - p4y;
						var v3x = p2x - p4x;
						var v3y = p2y - p4y;
						
						var cp1 = v2x*v1y - v1x*v2y;
						var cp2 = v3x*v1y - v1x*v3y;
						
						var v1x = p1x - p2x;
						var v1y = p1y - p2y;
						var v2x = p3x - p2x;
						var v2y = p3y - p2y;
						var v3x = p4x - p2x;
						var v3y = p4y - p2y;
						
						var cp3 = v2x*v1y - v1x*v2y;
						var cp4 = v3x*v1y - v1x*v3y;
						
						if( (((cp1 > 0) && (cp2 < 0)) ||
							 ((cp1 < 0) && (cp2 > 0))) &&
							(((cp3 > 0) && (cp4 < 0)) ||
							 ((cp3 < 0) && (cp4 > 0))) )
						{
							blockingLineIndex = i;
							return false;
						}
					}
				}
			}
			
			var v1x = p2x - p1x;
			var v1y = p2y - p1y;
			var d1 = Math.sqrt( v1x*v1x + v1y*v1y );
			
			for( var i in points )
			{
				if( i != pi1 && i != pi2 )
				{
					var p3 = points[i];
					var p3x = p3.x;
					var p3y = p3.y;
					var v2x = p3x - p2x;
					var v2y = p3y - p2y;
					
					var dp1 = v1x*v2x + v1y*v2y;
					if( dp1 < 0 )
					{
						var v3x = p3x - p1x;
						var v3y = p3y - p1y;
					
						var dp2 = (-v1x)*v3x + (-v1y)*v3y;
						if( dp2 < 0 )
						{
							var cp = v1x*v3y - v3x*v1y;
							var d2 = cp / d1;
							if( Math.abs(d2) <= pointSize )
							{
								blockingPointIndex = i;
								return false;
							}
						}
					}
				}
			}

			var addedTriangle = false;
			for( var i in points )
			{
				if( i != pi1 && i != pi2 )
				{
					var line1 = null;
					var line2 = null;
					for( var j in lines )
					{
						var line3 = lines[j];
						if(	(line3.pi1 == pi1 && line3.pi2 == i) ||
							(line3.pi1 == pi2 && line3.pi2 == i) ||
							(line3.pi2 == pi1 && line3.pi1 == i) ||
							(line3.pi2 == pi2 && line3.pi1 == i) )
						{
							if( line1 == null )
							{
								line1 = line3;
							}
							else
							{
								line2 = line3;
								
								if( i < pi1 )
								{
									if( AddTriangle( i, pi1, pi2 ) )
									{
										addedTriangle = true;
										playerScores[playerIndex] ++;
									}
								}
								else if( i < pi2 )
								{
									if( AddTriangle( pi1, i, pi2 ) )
									{
										addedTriangle = true;
										playerScores[playerIndex] ++;
									}
								}
								else
								{
									if( AddTriangle( pi1, pi2, i ) )
									{
										addedTriangle = true;
										playerScores[playerIndex] ++;
									}
								}
								break;
							}
						}
					}
				}
			}

			lines.push( new Line( pi1, pi2 ) );
			selectedPointIndex = null;
			if( !addedTriangle )
			{
				playerIndex = 1-playerIndex;
			}
			return true;
		}
		
		function AddTriangle( pi1, pi2, pi3 )
		{
			var p1 = points[pi1];
			var p1x = p1.x;
			var p1y = p1.y;
			var p2 = points[pi2];
			var p2x = p2.x;
			var p2y = p2.y;
			var p3 = points[pi3];
			var p3x = p3.x;
			var p3y = p3.y;
			
			var v1x = p3x - p1x;
			var v1y = p3y - p1y;
			var v2x = p2x - p1x;
			var v2y = p2y - p1y;
			
			for( var i in points )
			{
				if( i != pi1 && i != pi2 && i != pi3 )
				{
					var p4 = points[i];
					var p4x = p4.x;
					var p4y = p4.y;
					
					var v3x = p4x - p1x;
					var v3y = p4y - p1y;
					
					var dp1 = v1x*v1x + v1y*v1y;
					var dp2 = v1x*v2x + v1y*v2y;
					var dp3 = v1x*v3x + v1y*v3y;
					var dp4 = v2x*v2x + v2y*v2y;
					var dp5 = v2x*v3x + v2y*v3y;
					
					var invDenom = 1 / (dp1*dp4 - dp2*dp2);
					var u = (dp4*dp3 - dp2*dp5)*invDenom;
					var v = (dp1*dp5 - dp2*dp3)*invDenom;
					
					if( u>0 && v>0 && (u+v)<1 )
					{
						return false;
					}
				}
			}
			
			triangles.push( new Triangle( pi1, pi2, pi3 ) );
			return true;
		}
		
		function Test() {
			var pi1 = Math.floor( Math.random()*points.length );
			var pi2 = Math.floor( Math.random()*points.length );
			if( pi1 > pi2 ) {
				var temp = pi1;
				pi1 = pi2;
				pi2 = temp;
			}
		
			AddLine( pi1, pi2 );
		}
	</script>

</head>
<body>
	<canvas id="testCanvas" width="600" height="600"></canvas>
	<p style="color:#00ff00"><span id="player1score"/></p>
	<p style="color:#0000ff"><span id="player2score"/></p>
	
	<script>Init();</script>
</body>
</html>
